version: '3.8'

services:
  finance-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-os-app
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=file:/app/prisma/prod.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GDRIVE_CLIENT_EMAIL=${GDRIVE_CLIENT_EMAIL}
      - GDRIVE_PRIVATE_KEY=${GDRIVE_PRIVATE_KEY}
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID}
    volumes:
      - finance-os-db:/app/prisma
      - finance-os-uploads:/app/public/uploads
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: finance-os-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - finance-os
    networks:
      - finance-network

  certbot:
    image: certbot/certbot:latest
    container_name: finance-os-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  finance-os-db:
    name: financeos_db_data
  finance-os-uploads:
    name: financeos_uploads_data
  certbot-www:
    name: financeos_certbot_www
  certbot-certs:
    name: financeos_certbot_certs

networks:
  finance-network:
    driver: bridge
