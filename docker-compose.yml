version: '3.8'

services:
  finance-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-os-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-demo-secret-key-change-in-production-32chars}
      - DATABASE_URL=file:/app/prisma/dev.db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GDRIVE_CLIENT_EMAIL=${GDRIVE_CLIENT_EMAIL:-}
      - GDRIVE_PRIVATE_KEY=${GDRIVE_PRIVATE_KEY:-}
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID:-}
    volumes:
      - finance-os-db:/app/prisma
      - finance-os-uploads:/app/public/uploads

volumes:
  finance-os-db:
    name: financeos_db_data
  finance-os-uploads:
    name: financeos_uploads_data
